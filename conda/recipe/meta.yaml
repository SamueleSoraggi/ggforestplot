{% set version = "0.1.0" %}

package:
  name: r-ggforestplot
  version: {{ version }}

source:
  path: ../..

build:
  number: 0

requirements:
  build:
    - r-base>=3.5.0
  host:
    - r-base>=3.5.0
    - r-broom>=0.5.0
    - r-dplyr>=0.8.0
    - r-generics>=0.0.2
    - r-ggforce>=0.3.3
    - r-ggplot2>=3.1.0
    - r-ggplotify>=0.0.3
    - r-ggstance>=0.3.1
    - r-gridextra>=2.3
    - r-lazyeval>=0.2.2
    - r-magrittr>=1.5
    - r-patchwork>=1.0.0
    - r-purrr>=0.3.4
    - r-rlang>=0.4.11
    - r-scales>=1.1.0
    - r-stringr>=1.3.1
    - r-survival>=3.2_7
    - r-tibble>=3.1.1
    - r-tidyr>=1.1.4
    - r-tidyselect>=1.1.1
  run:
    - r-base>=3.5.0
    - r-broom>=0.5.0
    - r-dplyr>=0.8.0
    - r-generics>=0.0.2
    - r-ggforce>=0.3.3
    - r-ggplot2>=3.1.0
    - r-ggplotify>=0.0.3
    - r-ggstance>=0.3.1
    - r-gridextra>=2.3
    - r-lazyeval>=0.2.2
    - r-magrittr>=1.5
    - r-patchwork>=1.0.0
    - r-purrr>=0.3.4
    - r-rlang>=0.4.11
    - r-scales>=1.1.0
    - r-stringr>=1.3.1
    - r-survival>=3.2_7
    - r-tibble>=3.1.1
    - r-tidyr>=1.1.4
    - r-tidyselect>=1.1.1

test:
  commands:
    - R -e "library(ggforestplot); packageVersion('ggforestplot')"

about:
  home: https://github.com/nightingalehealth/ggforestplot
  license: MIT
  license_file: ../../LICENSE
  summary: Forestplots of measures of effects and confidence intervals
  description: |
    A collection of functions, based on ggplot2, to plot forestplots
    of measures of effects, e.g. linear associations, with their confidence intervals.
